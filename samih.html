<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تفعيل بوت سميح</title><style>body{font-family:Arial,sans-serif;max-width:520px;margin:70px auto;padding:20px;line-height:1.7}input,button{box-sizing:border-box;width:100%;padding:13px;margin:10px 0;font-size:16px}button{background:#174a3a;color:white;border:0;border-radius:8px}#result{white-space:pre-wrap}</style></head><body><h2>تفعيل بوت سميح (مرة واحدة)</h2><p>أدخل قيمة TELEGRAM_SETUP_SECRET التي حفظتها في Vercel. لن تُحفظ في المتصفح.</p><input type="password" id="secret" autocomplete="off" placeholder="رمز التفعيل"><button id="go">تفعيل الاتصال</button><p id="result" role="status"></p><script>document.getElementById('go').onclick=async()=>{const input=document.getElementById('secret');const value=input.value;input.value='';if(!value){document.getElementById('result').textContent='أدخل الرمز أولًا';return}const result=document.getElementById('result');result.textContent='جاري التفعيل...';try{const response=await fetch('/api/setup-telegram',{method:'POST',headers:{'x-setup-secret':value}});const data=await response.json();result.textContent=response.ok&&data.ok?'تم تفعيل اتصال تيليجرام بنجاح. احذف هذا الملف من GitHub بعد الاختبار.':'تعذر التفعيل: '+(data.description||data.error||response.status)}catch(e){result.textContent='فشل الاتصال. تأكد من نشر الموقع.'}};</script></body></html>
